# nginx serves the built React app AND load-balances the API across the backend
# instances. This replaces the Vite dev proxy in production (same origin → no CORS).

# Load balancer: round-robin API requests across the 3 backend instances. (Adding a
# server here is all it takes to scale out — this is the classic nginx LB pattern.)
upstream backend_pool {
    server backend1:8080;
    server backend2:8080;
    server backend3:8080;
}

server {
    listen 80;

    # API + SSE → the backend pool. Docker's internal DNS resolves backend1/2/3.
    location /api/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Server-Sent Events need streaming, not buffering — keep the connection open.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Everything else → the React single-page app. try_files falls back to index.html
    # so client-side routes (e.g. /tasks, /analytics) work on refresh.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
